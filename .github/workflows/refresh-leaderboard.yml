name: Refresh official GEMS leaderboard snapshot

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the fixed session branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a10964-gemsdoe37
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync the fixed session branch with main
        run: |
          git fetch origin main
          git merge --no-edit origin/main

      - name: Fetch and validate public leaderboard markup
        run: python scripts/refresh_leaderboard.py

      - name: Commit a changed snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/data/leaderboard.json; then
            echo "The public rows have not changed; no timestamp-only commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data/leaderboard.json
            git commit -m "Refresh official GEMS leaderboard snapshot"
          fi

      - name: Push and open or update a review PR if the tree differs from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin HEAD:arena/01a10964-gemsdoe37
          git fetch origin main
          if git diff --quiet origin/main HEAD; then
            echo "No site changes to propose."
            exit 0
          fi
          open_pr="$(gh pr list --head arena/01a10964-gemsdoe37 --base main --state open --json url --jq '.[0].url // empty')"
          if [ -z "$open_pr" ]; then
            gh pr create \
              --head arena/01a10964-gemsdoe37 \
              --base main \
              --title "Refresh official GEMS leaderboard snapshot" \
              --body "Automated, unauthenticated snapshot parsed from the official public DrivenData leaderboard. Please verify the source and capture timestamp before merging. No competition account or private data is accessed."
          else
            echo "Updated existing review PR: $open_pr"
          fi
